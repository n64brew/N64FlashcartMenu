name: Bug report
description: Create a bug report to help us improve
labels:
  - "bug"
  - "awaiting triage"
body:
  - type: markdown
    attributes:
      value: |
        # :warning: **Please read before raising the issue** :warning:

        If you have a **question** that needs clarification on something, or need help in a particular situation, **DO NOT** open an issue here, create a discussion instead. _Otherwise it will be automatically closed!_ .

        Please make sure to provide as much information as possible. 
        Failing to do so will most likely end up on the issue being closed without discussion. Don't take offense at this, 
        whenever an issue is raised without following the template and/or adding the required information, too much time has to be spent going back and forth to obtain the details that are outlined below.

  - type: markdown
    attributes:
      value: "### Console"

  - type: dropdown
    id: n64_region
    attributes:
      label: N64 console region
      options:
        - Unknown
        - NTSC-U
        - NTSC-J
        - PAL
        - MPAL
        - Other
    validations:
      required: true

  - type: dropdown
    id: expansion_pak
    attributes:
      label: Expansion Pak
      options:
        - Unknown
        - "Yes"
        - "No"
    validations:
      required: true

  - type: dropdown
    id: works_with_original_carts
    attributes:
      label: Does the console work with original cartridges?
      options:
        - Not checked
        - "Yes"
        - "No"
    validations:
      required: true

  - type: input
    id: hardware_mods
    attributes:
      label: Hardware modifications
      description: List any console modifications, or say "None" or "Unknown".
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### Flashcart"

  - type: dropdown
    id: flashcart_type
    attributes:
      label: Flashcart type
      options:
        - SummerCart64
        - 64drive
        - EverDrive 64 Pro
        - EverDrive 64 V3
        - EverDrive 64 X7
        - DaisyDrive64
        - Other
        - Unknown
    validations:
      required: true

  - type: input
    id: flashcart_supplier
    attributes:
      label: Flashcart supplier
      description: For example, Phenom mod, Krikzz store.
    validations:
      required: false

  - type: input
    id: flashcart_firmware_version
    attributes:
      label: Flashcart OS/firmware version
      description: Press (Start) on the menu, then (Check Flashcart Information), if available.
      placeholder: e.g. 0.2.0, N/A
    validations:
      required: true

  - type: dropdown
    id: flashcart_tests
    attributes:
      label: Do the flashcart's inbuilt tests pass?
      options:
        - "Yes"
        - "No"
        - Not run
        - Not available
    validations:
      required: false

  - type: dropdown
    id: flashcart_test_method
    attributes:
      label: How were the inbuilt tests run?
      options:
        - Flashcart button
        - SCDeployer over USB
        - Both
        - Not run
        - Not applicable
    validations:
      required: false

  - type: dropdown
    id: usb_connected
    attributes:
      label: Was USB connected to the flashcart when the issue occurred?
      options:
        - "Yes"
        - "No"
        - Unknown
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### Menu"

  - type: input
    id: menu_version
    attributes:
      label: N64 Flashcart Menu version
      description: Press (Start), then (Check Menu Information), or include the release/build URL.
      placeholder: e.g. 0.3.7
    validations:
      required: true

  - type: dropdown
    id: menu_source
    attributes:
      label: Where did this menu build come from?
      options:
        - Downloaded release
        - Built it myself
        - Other
        - Unknown
    validations:
      required: false

  - type: input
    id: last_working_menu_version
    attributes:
      label: Last menu version that worked
      placeholder: e.g. 0.3.0, Unknown
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### Filesystem"

  - type: input
    id: sd_card
    attributes:
      label: SD card make, model, and capacity
      placeholder: e.g. SanDisk Ultra, 32 GB
    validations:
      required: false

  - type: dropdown
    id: sd_card_filesystem
    attributes:
      label: SD card filesystem
      options:
        - FAT32
        - exFAT
        - Other
        - Unknown
    validations:
      required: false

  - type: input
    id: sd_card_format_options
    attributes:
      label: SD card format options
      description: Include any non-default options used when formatting, if known.
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### Last loaded ROM"

  - type: input
    id: last_loaded_rom
    attributes:
      label: Last loaded ROM
      description: Include the game name or filename, if known.
    validations:
      required: false

  - type: dropdown
    id: unofficial_rom
    attributes:
      label: Was the last loaded ROM an unofficial release?
      options:
        - "Yes"
        - "No"
        - Unknown
    validations:
      required: false

  - type: dropdown
    id: custom_rom_override
    attributes:
      label: Is there a custom override setting for this ROM?
      options:
        - "Yes"
        - "No"
        - Unknown
    validations:
      required: false

  - type: input
    id: custom_rom_override_details
    attributes:
      label: Custom override details
      description: If applicable, describe the setting or where it is configured.
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    id: repro_steps
    attributes:
      label: How to reproduce
      description: Detailed repro steps so we can see the same problem. If not already explained above.
      placeholder: |
        1.
        2.
        ...
    validations:
      required: false

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen. If applicable.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Very helpful if you send along a few screenshots to help visualize the issue!
      placeholder: drag and drop here, if applicable
    validations:
      required: false

  - type: textarea
    id: configuration_file
    attributes:
      label: configuration file(s)
      description: The text of the configuration file(s) used. If applicable.
      placeholder: |
        for example paste the content of the configuration file (config.ini) here.
    validations:
      required: false

  - type: textarea
    id: other_things
    attributes:
      label: Additional information
      description: Other suggested things. If applicable/relevant.
      placeholder: |
        for example link to the repository with sample code
        code snippets
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Make an effort to fix the bug
        Try using github co-pilot or other AI tools to help you further describe and/or fix the bug.
        
        Attempt to submit a [Pull Request (PR)](https://help.github.com/articles/about-pull-requests/) that fixes the bug. Include in this PR a test that verifies the fix. If you were not able to fix the bug, a PR that illustrates your partial progress will suffice.
